<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Family birthdays</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EEEBF6;
      --card: #ffffff;
      --ink: #241E3F;
      --mute: #67628A;
      --line: #D8D3EA;
      --fam: #5B3FD0;
      --kid: #0B8F82;
      --sun: #F2A22B;
      --sunbg: #FFE9C2;
      --sunink: #4A2D00;
      --shadow: rgba(25, 18, 50, .08);
      --panel: rgba(255,255,255,.55);
      --danger: #9f2d3a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171230;
        --card: #221B42;
        --ink: #EEEAFB;
        --mute: #A8A2C8;
        --line: #382F63;
        --fam: #A99AFF;
        --kid: #4FD3C2;
        --sun: #F6B94E;
        --sunbg: #4A3510;
        --sunink: #FFE3A8;
        --panel: rgba(34,27,66,.68);
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.5 Figtree, system-ui, sans-serif;
      min-height: 100vh;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 26px 18px 60px;
    }

    .topbar {
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 12px;
      font: 800 clamp(2.4rem, 8vw, 4.6rem)/0.95 "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: -0.05em;
    }

    .intro {
      margin: 0;
      color: var(--mute);
      max-width: 44ch;
      font-size: clamp(1rem, 2vw, 1.1rem);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(260px, 1.2fr);
      gap: 32px;
      align-items: center;
      margin-bottom: 18px;
    }

    .ring-panel,
    .meta-panel,
    .list-panel {
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 14px 30px var(--shadow);
    }

    .ring-panel {
      padding: 18px;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .meta-panel {
      padding: 20px 18px 18px;
    }

    .ringwrap {
      position: relative;
      width: min(100%, 480px);
      aspect-ratio: 1;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .rim { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .core { fill: var(--card); stroke: var(--line); }
    .month-label {
      font: 700 12px Figtree, sans-serif;
      fill: var(--mute);
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
    }
    .month-btn { cursor: pointer; }
    .month-btn .hit { fill: transparent; }
    .month-btn:hover .hit,
    .month-btn:focus-visible .hit,
    .month-btn.on .hit { fill: rgba(150, 138, 204, 0.24); }
    .month-btn.on .month-label { fill: var(--ink); }
    .month-dot {
      fill: var(--sun);
      opacity: 0.9;
      stroke: var(--card);
      stroke-width: 2;
    }

    .center {
      position: absolute;
      inset: 27%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    .center small {
      color: var(--mute);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .center strong {
      margin: 5px 0 4px;
      font: 800 clamp(1.2rem, 4.4vw, 1.85rem)/1.1 "Bricolage Grotesque", system-ui, sans-serif;
      text-wrap: balance;
    }

    .center span {
      color: var(--mute);
      font-size: 0.88rem;
    }

    .center b {
      margin-top: 10px;
      padding: 4px 12px;
      border-radius: 99px;
      background: var(--sunbg);
      color: var(--sunink);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--mute);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--fam);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
    }

    .legend .kid i { background: var(--kid); }
    .legend .sun i { background: var(--sun); }

    .filter-block {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .search {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    .search:focus {
      border-color: var(--sun);
      box-shadow: 0 0 0 3px rgba(242,162,43,0.12);
    }

    .seg {
      display: flex;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: var(--mute);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      transition: all .2s ease;
      flex: 1 1 90px;
      min-width: 86px;
    }

    .seg button.active {
      background: var(--sunbg);
      color: var(--sunink);
    }

    .month-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .month-pill {
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--mute);
      border-radius: 999px;
      padding: 8px 12px;
      min-width: 58px;
      font-weight: 700;
      transition: .2s ease;
    }

    .month-pill.active {
      background: var(--fam);
      color: white;
      border-color: var(--fam);
    }

    .list-panel {
      padding: 18px 18px 10px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .list-header h2 {
      margin: 0;
      font: 800 1.5rem/1.2 "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: -0.03em;
    }

    .page-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .page-nav button {
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 700;
      color: var(--ink);
    }

    .page-nav button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .page-indicator {
      color: var(--mute);
      font-weight: 700;
      min-width: 90px;
      text-align: center;
    }

    .birthday-list {
      display: grid;
      gap: 12px;
    }

    .person {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) auto auto;
      gap: 12px;
      align-items: center;
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .person.upcoming {
      border-color: rgba(242, 162, 43, 0.9);
      background: linear-gradient(180deg, rgba(255, 233, 194, 0.45), rgba(255,255,255,0.96));
      box-shadow: 0 12px 28px rgba(242, 162, 43, 0.12);
    }

    .person-main {
      min-width: 0;
    }

    .person-name {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .person-name strong {
      font-size: 1.07rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #fff;
      background: var(--fam);
    }

    .tag.kid { background: var(--kid); }
    .tag.sun { background: var(--sun); color: var(--sunink); }

    .upcoming-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: var(--sunbg);
      color: var(--sunink);
    }

    .person-meta {
      color: var(--mute);
      font-size: 0.94rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .person-meta .dot {
      display: inline-flex;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--line);
      align-self: center;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-btn {
      border: 1.5px solid var(--line);
      background: transparent;
      border-radius: 10px;
      padding: 8px 11px;
      color: var(--ink);
      font-weight: 700;
      white-space: nowrap;
    }

    .mini-btn.primary {
      background: var(--sunbg);
      border-color: transparent;
      color: var(--sunink);
    }

    .empty-state {
      text-align: center;
      color: var(--mute);
      padding: 28px 10px 18px;
      font-weight: 600;
    }

    .site-footer {
      border-top: 1.5px solid var(--line);
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(10px);
      margin-top: 2px;
    }

    .site-footer-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--mute);
      font-size: 0.94rem;
      font-weight: 600;
    }

    .site-footer a {
      color: var(--fam);
      text-decoration: none;
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .ring-panel {
        min-height: 340px;
      }

      .person {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .wrap { padding: 20px 12px 46px; }

      .ring-panel,
      .meta-panel,
      .list-panel {
        border-radius: 18px;
      }

      .search { padding: 11px 12px; }

      .seg button {
        flex: 1 1 32%;
      }

      .month-pill {
        flex: 1 1 calc(25% - 10px);
        min-width: unset;
      }

      .list-header {
        align-items: flex-start;
      }

      .page-nav {
        width: 100%;
        justify-content: space-between;
        gap: 6px;
      }

      .page-nav button {
        flex: 1 1 0;
      }

      .page-indicator {
        min-width: 0;
        flex: 1 1 auto;
      }

      .person {
        padding: 12px 12px;
      }

      .person-name {
        gap: 6px;
      }

      .actions {
        width: 100%;
      }

      .mini-btn {
        flex: 1 1 100%;
        width: 100%;
      }

      .site-footer-inner {
        padding: 14px 12px 22px;
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <h1>Family birthdays</h1>
      <p class="intro">Every birthday around one year. Tap a dot to see who it belongs to, or tap a month to filter the list.</p>
    </header>

    <section class="hero">
      <div class="ring-panel">
        <div class="ringwrap">
          <svg id="yearRing" viewBox="0 0 420 420" aria-label="Birthday month selector"></svg>
          <div class="center">
            <small id="centerLabel">This month</small>
            <strong id="centerMonth">All year</strong>
            <span id="centerCount">0 birthdays</span>
            <b id="centerTag">Everyone</b>
          </div>
        </div>
      </div>

      <div class="meta-panel">
        <div class="meta-top">
          <div class="legend" aria-label="Legend">
            <span class="fam"><i></i> Borora</span>
            <span class="kid"><i></i> Chotora</span>
            <span class="sun"><i></i> Today</span>
          </div>
        </div>

        <div class="filter-block">
          <input id="searchInput" class="search" type="search" aria-label="Search birthdays" placeholder="Search names or tag..." />

          <div class="seg" aria-label="Birthday group filter">
            <button type="button" class="active" data-tag="all">All year</button>
            <button type="button" data-tag="Borora">Borora</button>
            <button type="button" data-tag="Chotora">Chotora</button>
            <button type="button" data-tag="next-up">Next up</button>
          </div>

          <div id="monthStrip" class="month-strip" aria-label="Month filter"></div>
        </div>
      </div>
    </section>

    <section class="list-panel">
      <div class="list-header">
        <h2 id="listTitle">Birthdays</h2>
        <div class="page-nav" aria-label="Pagination controls">
          <button id="prevPage" type="button">Prev</button>
          <span class="page-indicator" id="pageInfo">Page 1 of 1</span>
          <button id="nextPage" type="button">Next</button>
        </div>
      </div>

      <div id="birthdayList" class="birthday-list" aria-live="polite"></div>
    </section>
  </div>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Birthday reminders for family and friends.</span>
      <a href="#top">Back to top</a>
    </div>
  </footer>

  <script>
    const monthNames = [
      'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
    ];

    const birthdays = [
      { id: 1, name: 'Nafisa', month: 1, day: 12, tag: 'Borora' },
      { id: 2, name: 'Elias', month: 1, day: 28, tag: 'Chotora' },
      { id: 3, name: 'Priya', month: 2, day: 6, tag: 'Borora' },
      { id: 4, name: 'Ayaan', month: 2, day: 17, tag: 'Chotora' },
      { id: 5, name: 'Mira', month: 3, day: 4, tag: 'Borora' },
      { id: 6, name: 'Junaid', month: 3, day: 18, tag: 'Chotora' },
      { id: 7, name: 'Sadia', month: 4, day: 10, tag: 'Borora' },
      { id: 8, name: 'Hassan', month: 4, day: 29, tag: 'Chotora' },
      { id: 9, name: 'Lina', month: 5, day: 2, tag: 'Borora' },
      { id: 10, name: 'Zaid', month: 5, day: 22, tag: 'Chotora' },
      { id: 11, name: 'Rima', month: 6, day: 5, tag: 'Borora' },
      { id: 12, name: 'Aarav', month: 6, day: 19, tag: 'Chotora' },
      { id: 13, name: 'Maham', month: 7, day: 8, tag: 'Borora' },
      { id: 14, name: 'Noah', month: 7, day: 24, tag: 'Chotora' },
      { id: 15, name: 'Sara', month: 8, day: 13, tag: 'Borora' },
      { id: 16, name: 'Rayyan', month: 8, day: 26, tag: 'Chotora' },
      { id: 17, name: 'Aisha', month: 9, day: 2, tag: 'Borora' },
      { id: 18, name: 'Tariq', month: 9, day: 20, tag: 'Chotora' },
      { id: 19, name: 'Nadia', month: 10, day: 7, tag: 'Borora' },
      { id: 20, name: 'Yusuf', month: 10, day: 18, tag: 'Chotora' },
      { id: 21, name: 'Samira', month: 11, day: 3, tag: 'Borora' },
      { id: 22, name: 'Hamza', month: 11, day: 21, tag: 'Chotora' },
      { id: 23, name: 'Nour', month: 12, day: 11, tag: 'Borora' },
      { id: 24, name: 'Ibrahim', month: 12, day: 29, tag: 'Chotora' },
      { id: 25, name: 'Farah', month: 12, day: 31, tag: 'Borora' },
      { id: 26, name: 'Zahra', month: 4, day: 14, tag: 'Borora' },
      { id: 27, name: 'Adnan', month: 8, day: 9, tag: 'Chotora' },
      { id: 28, name: 'Haniya', month: 11, day: 27, tag: 'Borora' }
    ];

    const state = {
      activeTag: 'all',
      selectedMonth: null,
      search: '',
      page: 1,
      pageSize: 7
    };

    const ringEl = document.getElementById('yearRing');
    const monthStrip = document.getElementById('monthStrip');
    const listEl = document.getElementById('birthdayList');
    const searchInput = document.getElementById('searchInput');
    const pageInfo = document.getElementById('pageInfo');
    const listTitle = document.getElementById('listTitle');
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const centerMonth = document.getElementById('centerMonth');
    const centerCount = document.getElementById('centerCount');
    const centerTag = document.getElementById('centerTag');

    function getNextBirthday(items = birthdays) {
      const today = new Date();
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      let next = null;
      let soonest = Number.POSITIVE_INFINITY;

      items.forEach(person => {
        const candidate = new Date(todayDate.getFullYear(), person.month - 1, person.day);
        if (candidate < todayDate) {
          candidate.setFullYear(candidate.getFullYear() + 1);
        }

        const diff = candidate.getTime() - todayDate.getTime();
        if (diff >= 0 && diff < soonest) {
          soonest = diff;
          next = person;
        }
      });

      return next;
    }

    function getMonthCount(month, tag = 'all') {
      return birthdays.filter(person => {
        const tagMatch = tag === 'all' || tag === 'next-up' || person.tag === tag;
        return person.month === month && tagMatch;
      }).length;
    }

    function getFilteredBirthdays() {
      const q = state.search.trim().toLowerCase();
      const base = birthdays.filter(person => {
        const tagMatch = state.activeTag === 'all' || state.activeTag === 'next-up' || person.tag === state.activeTag;
        const monthMatch = state.selectedMonth === null || person.month === state.selectedMonth;
        const searchMatch = !q || person.name.toLowerCase().includes(q) || person.tag.toLowerCase().includes(q);
        return tagMatch && monthMatch && searchMatch;
      }).sort((a, b) => (a.month - b.month) || (a.day - b.day) || a.name.localeCompare(b.name));

      if (state.activeTag === 'next-up') {
        const nextBirthday = getNextBirthday(base);
        return nextBirthday ? [nextBirthday] : [];
      }

      return base;
    }

    function getVisiblePageItems(items) {
      const totalPages = Math.max(1, Math.ceil(items.length / state.pageSize));
      state.page = Math.min(state.page, totalPages);
      const start = (state.page - 1) * state.pageSize;
      return {
        items: items.slice(start, start + state.pageSize),
        totalPages
      };
    }

    function renderMonthStrip() {
      monthStrip.innerHTML = '';

      monthNames.forEach((monthName, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'month-pill' + (state.selectedMonth === index + 1 ? ' active' : '');
        btn.textContent = monthName;
        btn.title = `Filter ${monthName}`;
        btn.addEventListener('click', () => {
          state.selectedMonth = state.selectedMonth === index + 1 ? null : index + 1;
          state.page = 1;
          render();
        });
        monthStrip.appendChild(btn);
      });
    }

    function renderRing() {
      const cx = 210;
      const cy = 210;
      const outerRadius = 176;
      const innerRadius = 118;
      const ringGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

      const bgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      bgCircle.setAttribute('cx', cx);
      bgCircle.setAttribute('cy', cy);
      bgCircle.setAttribute('r', outerRadius);
      bgCircle.setAttribute('class', 'core');
      ringGroup.appendChild(bgCircle);

      const rim = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      rim.setAttribute('cx', cx);
      rim.setAttribute('cy', cy);
      rim.setAttribute('r', outerRadius);
      rim.setAttribute('class', 'rim');
      ringGroup.appendChild(rim);

      const innerRing = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      innerRing.setAttribute('cx', cx);
      innerRing.setAttribute('cy', cy);
      innerRing.setAttribute('r', innerRadius);
      innerRing.setAttribute('class', 'rim');
      ringGroup.appendChild(innerRing);

      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12 - Math.PI / 2;
        const lx = cx + Math.cos(angle) * (outerRadius + 36);
        const ly = cy + Math.sin(angle) * (outerRadius + 36);

        const monthBtn = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        monthBtn.setAttribute('class', 'month-btn' + (state.selectedMonth === i + 1 ? ' on' : ''));
        monthBtn.setAttribute('tabindex', '0');
        monthBtn.setAttribute('role', 'button');
        monthBtn.setAttribute('aria-label', `Filter ${monthNames[i]}`);

        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hit.setAttribute('cx', lx);
        hit.setAttribute('cy', ly);
        hit.setAttribute('r', 32);
        hit.setAttribute('class', 'hit');

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', lx);
        label.setAttribute('y', ly + 2);
        label.setAttribute('class', 'month-label');
        label.textContent = monthNames[i];

        const dotCount = getMonthCount(i + 1, state.activeTag);
        if (dotCount > 0) {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', lx);
          dot.setAttribute('cy', ly + 42);
          dot.setAttribute('r', Math.min(5 + dotCount * 0.7, 9));
          dot.setAttribute('class', 'month-dot');
          monthBtn.appendChild(dot);
        }

        monthBtn.appendChild(hit);
        monthBtn.appendChild(label);

        const activate = () => {
          state.selectedMonth = state.selectedMonth === i + 1 ? null : i + 1;
          state.page = 1;
          render();
        };

        monthBtn.addEventListener('click', activate);
        monthBtn.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            activate();
          }
        });

        ringGroup.appendChild(monthBtn);
      }

      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12 - Math.PI / 2;
        const x1 = cx + Math.cos(angle) * (outerRadius - 9);
        const y1 = cy + Math.sin(angle) * (outerRadius - 9);
        const x2 = cx + Math.cos(angle) * (outerRadius + 10);
        const y2 = cy + Math.sin(angle) * (outerRadius + 10);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('class', 'tick');
        ringGroup.appendChild(line);
      }

      ringEl.innerHTML = '';
      ringEl.appendChild(ringGroup);

      const monthCaption = state.selectedMonth ? monthNames[state.selectedMonth - 1] : 'All year';
      const activeCount = state.selectedMonth
        ? getMonthCount(state.selectedMonth, state.activeTag)
        : birthdays.filter(person => state.activeTag === 'all' || state.activeTag === 'next-up' || person.tag === state.activeTag).length;

      centerMonth.textContent = state.activeTag === 'next-up' ? 'Next up' : monthCaption;
      centerCount.textContent = `${activeCount} birthday${activeCount === 1 ? '' : 's'}`;
      centerTag.textContent = state.activeTag === 'all' ? 'Everyone' : state.activeTag === 'next-up' ? 'Next up' : state.activeTag;
    }

    function renderList() {
      const items = getFilteredBirthdays();
      const { items: pageItems, totalPages } = getVisiblePageItems(items);
      const upcomingPerson = getNextBirthday(birthdays);

      listTitle.textContent = state.activeTag === 'next-up'
        ? 'Next up'
        : state.selectedMonth
          ? `${monthNames[state.selectedMonth - 1]} birthdays`
          : state.activeTag === 'all'
            ? 'Birthdays'
            : `${state.activeTag} birthdays`;

      if (!pageItems.length) {
        listEl.innerHTML = '<div class="empty-state">No birthdays match your search or filter.</div>';
        pageInfo.textContent = 'Page 0 of 0';
        prevPageBtn.disabled = true;
        nextPageBtn.disabled = true;
        return;
      }

      listEl.innerHTML = pageItems.map((person) => {
        const birthDate = new Date(2025, person.month - 1, person.day);
        const formattedDate = birthDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const isUpcoming = upcomingPerson && person.id === upcomingPerson.id;

        return `
          <article class="person ${isUpcoming ? 'upcoming' : ''}" data-id="${person.id}">
            <div class="person-main">
              <div class="person-name">
                <strong>${escapeHtml(person.name)}</strong>
                <span class="tag ${person.tag === 'Chotora' ? 'kid' : ''}">${person.tag}</span>
                ${isUpcoming ? '<span class="upcoming-badge">Upcoming</span>' : ''}
              </div>
              <div class="person-meta">
                <span>${formattedDate}</span>
                <span class="dot" aria-hidden="true"></span>
                <span>${person.tag}</span>
              </div>
            </div>
            <div class="actions">
              <button type="button" class="mini-btn" data-action="rename" data-id="${person.id}">Fix name</button>
              <button type="button" class="mini-btn primary" data-action="calendar" data-id="${person.id}">Add to Google Calendar</button>
            </div>
          </article>
        `;
      }).join('');

      pageInfo.textContent = `Page ${state.page} of ${totalPages}`;
      prevPageBtn.disabled = state.page <= 1;
      nextPageBtn.disabled = state.page >= totalPages;

      listEl.querySelectorAll('[data-action="rename"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const person = birthdays.find(item => item.id === Number(btn.dataset.id));
          if (!person) return;
          const nextName = window.prompt('Update the birthday name:', person.name);
          if (nextName && nextName.trim()) {
            person.name = nextName.trim();
            render();
          }
        });
      });

      listEl.querySelectorAll('[data-action="calendar"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const person = birthdays.find(item => item.id === Number(btn.dataset.id));
          if (!person) return;
          const date = new Date();
          const year = date.getFullYear();
          const start = new Date(year, person.month - 1, person.day, 9, 0, 0);
          if (start < date) {
            start.setFullYear(start.getFullYear() + 1);
          }
          const end = new Date(start);
          end.setDate(end.getDate() + 1);
          const formatGoogleDate = value => {
            const y = value.getFullYear();
            const m = String(value.getMonth() + 1).padStart(2, '0');
            const d = String(value.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
          };
          const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`${person.name}'s Birthday`)}&dates=${formatGoogleDate(start)}/${formatGoogleDate(end)}`;
          window.open(url, '_blank', 'noopener');
        });
      });
    }

    function render() {
      renderMonthStrip();
      renderRing();
      renderList();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.querySelectorAll('.seg button').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTag = btn.dataset.tag;
        state.page = 1;
        document.querySelectorAll('.seg button').forEach(item => item.classList.toggle('active', item === btn));
        render();
      });
    });

    searchInput.addEventListener('input', (event) => {
      state.search = event.target.value;
      state.page = 1;
      render();
    });

    prevPageBtn.addEventListener('click', () => {
      if (state.page > 1) {
        state.page -= 1;
        renderList();
      }
    });

    nextPageBtn.addEventListener('click', () => {
      const filtered = getFilteredBirthdays();
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
      if (state.page < totalPages) {
        state.page += 1;
        renderList();
      }
    });

    render();
  </script>
</body>
</html>
