<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My Birthday Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#EEEBF6;
  --card:#fff;
  --ink:#3c4452;
  --mute:#67628A;
  --line:#D8D3EA;
  --fam:#5B3FD0;
  --kid:#0B8F82;
  --sun:#F2A22B;
  --sunbg:#FFE9C2;
  --sunink:#4A2D00;
  --shadow:0 16px 40px rgba(39,28,78,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#171230;
    --card:#221B42;
    --ink:#3c4452;
    --mute:#A8A2C8;
    --line:#382F63;
    --fam:#A99AFF;
    --kid:#4FD3C2;
    --sun:#F6B94E;
    --sunbg:#4A3510;
    --sunink:#FFE3A8;
    --shadow:0 18px 42px rgba(14,10,32,.46);
  }
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 16px/1.5 Figtree, system-ui, sans-serif;
}
button, input, select {
  font:inherit;
}
button {
  color:inherit;
  cursor:pointer;
}
img, svg { display:block; max-width:100%; }
a { color:inherit; }
.wrap {
  max-width:1180px;
  margin:0 auto;
  padding:20px 18px 60px;
}
.page-header {
  text-align:center;
  margin:12px auto 10px;
  max-width:860px;
}
.page-header h1 {
  margin:0;
  font:800 clamp(2.4rem, 6vw, 4.5rem)/.98 'Bricolage Grotesque', system-ui, sans-serif;
  letter-spacing:-.04em;
}
.page-header p {
  margin:10px auto 0;
  max-width:60ch;
  color:var(--mute);
  font-size:1.04rem;
}
.hero {
  display:flex;
  justify-content:center;
  margin:18px 0 18px;
}
.ringwrap {
  position:relative;
  width:min(100%, 560px);
  aspect-ratio:1;
  margin:0 auto;
}
svg {
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}
.rim{fill:none;stroke:var(--line);stroke-width:1.5}
.core{fill:var(--card);stroke:var(--line)}
.tick{stroke:var(--line);stroke-width:1.5}
.mo{cursor:pointer;outline:none}
.mo text{fill:var(--mute);font:600 12px Figtree,system-ui,sans-serif}
.mo:hover text,.mo.on text,.mo:focus-visible text{fill:var(--ink)}
.mo .hit{fill:transparent}
.mo.on .hit,.mo:focus-visible .hit{fill:var(--line)}
.today{stroke:var(--sun);stroke-width:2.5;stroke-linecap:round}
.tdot{fill:var(--sun)}
.dot{cursor:pointer;transition:opacity .2s,r .15s;transform-box:fill-box;transform-origin:center;animation:pop .5s backwards;animation-delay:calc(var(--i)*14ms);outline:none}
.dot.a{fill:var(--fam)}.dot.k{fill:var(--kid)}
.dot.dim{opacity:.15}
.dot:hover,.dot:focus-visible{r:7;stroke:var(--sun);stroke-width:3}
.dot.next{stroke:var(--sun);stroke-width:3}
@keyframes pop{from{opacity:0;transform:scale(0)}}
.center{position:absolute;inset:25%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.center small{color:var(--mute);font-size:.78rem}
.center strong{font:800 clamp(1.1rem,4.2vw,1.8rem)/1.1 'Bricolage Grotesque',system-ui,sans-serif;text-wrap:balance;margin:4px 0}
.center span{color:var(--mute);font-size:.9rem}
.center b{margin-top:8px;padding:4px 12px;border-radius:999px;background:var(--sunbg);color:var(--sunink);font-size:.82rem;font-weight:700}
.controls {
  display:grid;
  grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr));
  gap:10px;
  align-items:center;
  margin:10px 0 18px;
}
.search {
  width:100%;
  min-width:0;
  min-height:44px;
  padding:0 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  box-shadow:var(--shadow);
}
.seg {
  display:flex;
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:3px;
  box-shadow:var(--shadow);
  width:100%;
}
.seg button {
  border:0;
  background:none;
  padding:8px 12px;
  border-radius:9px;
  color:var(--mute);
  font-weight:700;
  width:100%;
  min-height:40px;
}
.seg button[aria-pressed=true] {
  background:var(--ink);
  color:var(--bg);
}
.add {
  border:0;
  background:var(--fam);
  color:var(--bg);
  padding:11px 18px;
  border-radius:12px;
  font-weight:700;
  box-shadow:var(--shadow);
  min-height:44px;
  width:100%;
}
.pills {
  display:grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap:8px;
  padding:2px 0 10px;
  scrollbar-width:none;
}
.pills button {
  width:100%;
  border:1.5px solid var(--line);
  background:none;
  padding:6px 8px;
  border-radius:999px;
  color:var(--mute);
  font-size:.9rem;
  text-align:center;
}
.pills button[aria-pressed=true] {
  border-color:var(--ink);
  color:var(--ink);
  font-weight:700;
}
.pills .count {
  font-size:.75rem;
  opacity:.8;
}
.mh {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  padding:18px 0 8px;
  border-bottom:1.5px solid var(--line);
  margin-top:10px;
}
.mh h2 {
  margin:0;
  font:800 1.5rem 'Bricolage Grotesque',system-ui,sans-serif;
  letter-spacing:-.01em;
}
.mh span {
  color:var(--mute);
  font-size:.85rem;
}
.list {
  display:grid;
  gap:10px;
}
.row {
  display:grid;
  grid-template-columns:52px minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
  padding:12px 14px;
  margin:0;
  background:var(--card);
  border-radius:14px;
  border-left:5px solid var(--fam);
  box-shadow:var(--shadow);
}
.row.k { border-left-color:var(--kid); }
.row .d {
  font:800 1.8rem/1 'Bricolage Grotesque',system-ui,sans-serif;
  text-align:center;
}
.row .d small {
  display:block;
  font:600 .72rem Figtree,system-ui,sans-serif;
  color:var(--mute);
  margin-top:4px;
}
.row .n {
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  flex-wrap:wrap;
}
.row .s {
  color:var(--mute);
  font-size:.85rem;
  margin-top:4px;
}
.row .meta {
  display:flex;
  flex-direction:column;
  min-width:0;
}
.badge {
  font-size:.82rem;
  color:var(--mute);
  white-space:nowrap;
  justify-self:end;
}
.badge.soon {
  background:var(--sunbg);
  color:var(--sunink);
  padding:4px 10px;
  border-radius:999px;
  font-weight:700;
}
.row-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.row-actions button {
  border:1.5px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  padding:7px 10px;
  border-radius:10px;
  font-size:.8rem;
}
.row-actions .gcal {
  background:var(--sunbg);
  border-color:var(--sunbg);
  color:var(--sunink);
}
.x {
  border:0;
  background:none;
  color:var(--mute);
  font-size:.8rem;
  text-decoration:underline;
  padding:0;
}
.empty {
  padding:40px 0;
  color:var(--mute);
  text-align:center;
}
.pager {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-top:18px;
  flex-wrap:wrap;
}
.pager button {
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  padding:8px 14px;
  border-radius:10px;
  font-weight:700;
}
.pager button:disabled {
  opacity:.45;
  cursor:not-allowed;
}
.pager .page-indicator {
  color:var(--mute);
  font-size:.92rem;
  min-width:100px;
  text-align:center;
}
footer {
  margin-top:36px;
  color:var(--mute);
  font-size:.88rem;
  max-width:60ch;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}
footer span {
  white-space:nowrap;
}
 dialog {
  border:0;
  border-radius:18px;
  background:var(--card);
  color:var(--ink);
  padding:24px;
  width:min(92vw, 390px);
  box-shadow:var(--shadow);
}
 dialog::backdrop {
  background:rgba(20,10,50,.55);
}
 dialog h3 {
  margin:0 0 14px;
  font:800 1.4rem 'Bricolage Grotesque',system-ui,sans-serif;
}
 dialog label {
  display:block;
  margin-bottom:12px;
  font-size:.9rem;
  color:var(--mute);
}
 dialog input, dialog select {
  display:block;
  width:100%;
  margin-top:4px;
  padding:10px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:var(--bg);
  color:var(--ink);
}
 .two {
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
}
 dialog .chk {
  display:flex;
  gap:8px;
  align-items:center;
}
 dialog .chk input {
  width:auto;
  margin:0;
}
 .acts {
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:6px;
}
 .acts button {
  padding:9px 16px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:none;
}
 .acts .go {
  background:var(--fam);
  color:var(--bg);
  border-color:var(--fam);
  font-weight:700;
}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}} 
@media (max-width: 700px) {
  .wrap { padding-left:12px; padding-right:12px; }
  .page-header { margin-top:8px; }
  .hero { margin-top:12px; }
  .controls {
    grid-template-columns:1fr;
    align-items:stretch;
  }
  .search, .seg, .add {
    width:100%;
  }
  .search {
    min-height:40px;
    padding:0 12px;
  }
  .seg {
    justify-content:space-between;
  }
  .seg button {
    flex:1;
    min-height:38px;
    padding:8px 10px;
  }
  .pills {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap:6px;
  }
  .mh {
    align-items:flex-start;
    flex-direction:column;
  }
  .row {
    grid-template-columns:42px minmax(0,1fr);
    grid-template-areas:
      "d meta"
      "d actions";
    padding:12px 12px 10px;
  }
  .row .d { grid-area:d; }
  .row .meta { grid-area:meta; }
  .row .badge { grid-area:actions; justify-self:start; margin-top:8px; }
  .row-actions {
    margin-top:8px;
  }
  .pager {
    justify-content:space-between;
  }
  .page-indicator {
    order:1;
    width:100%;
    min-width:0;
    text-align:center;
  }
  footer {
    text-align:center;
    justify-content:center;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <h1 id="pageTitle">My Birthday Calendar</h1>
    <p>Every birthday around one year. Tap a dot to see who it belongs to, or tap a month to filter the list.</p>
  </header>

  <div class="hero">
    <div class="ringwrap">
      <svg id="ring" viewBox="0 0 400 400" role="group" aria-label="Year wheel of birthdays"></svg>
      <div class="center" id="center" aria-live="polite"></div>
    </div>
  </div>

  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search a name" aria-label="Search a name">
    <div class="seg" id="kind">
      <button data-v="all" aria-pressed="true">Everyone</button>
      <button data-v="fam" aria-pressed="false">Borora</button>
      <button data-v="kid" aria-pressed="false">Chotora</button>
    </div>
    <div class="seg" id="sort">
      <button data-v="month" aria-pressed="true">By month</button>
      <button data-v="next" aria-pressed="false">Next up</button>
    </div>
    <button class="add" id="add">Add birthday</button>
  </div>

  <nav class="pills" id="pills" aria-label="Filter by month"></nav>
  <main id="list" class="list"></main>
  <div id="pager" class="pager" aria-label="Birthday pager"></div>
  <footer>
    <span>© 2026 My Birthday Calendar</span>
    <span>Developed by Raiyeem Farhan</span>
  </footer>
</div>

<dialog id="dlg">
  <form id="f">
    <h3 id="dlgTitle">Add a birthday</h3>
    <label>Name<input id="fn" required maxlength="40" autocomplete="off"></label>
    <div class="two">
      <label>Month<select id="fm"></select></label>
      <label>Day<input id="fd" type="number" min="1" max="31" required></label>
    </div>
    <label class="chk"><input id="fk" type="checkbox">This is a Chotora</label>
    <div class="acts">
      <button type="button" id="cx">Cancel</button>
      <button class="go" id="saveBirthday" type="submit">Save birthday</button>
    </div>
  </form>
</dialog>

<dialog id="resetDlg">
  <form id="resetForm">
    <h3>Reset birthday list</h3>
    <p>Are you sure you want to clear all saved birthday entries?</p>
    <div class="acts">
      <button type="button" id="resetCancel">Cancel</button>
      <button class="go" type="submit">Reset entries</button>
    </div>
  </form>
</dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FULL_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SHORT_MONTHS=FULL_MONTHS.map(m=>m.slice(0,3));
const FAMILY_LABEL='Borora';
const KID_LABEL='Chotora';
const PAGE_SIZE=7;
const RESET_THRESHOLD=5;

const DIM=[31,29,31,30,31,30,31,31,30,31,30,31];
const KIDS='Aliza Aliya Asher Eesa Isabella Adam Kinnory Rahmah Tanisha Eram Jadduka Ameera Bushra Inaya Aydin Kiron'.split(' ');
const BASE=[
  [1,5,'Aliza'],[1,6,'Titash'],[1,13,'Papu'],[1,14,'Yusra'],[1,15,'Adrita'],[1,24,'Ilma'],[1,24,'Aliya'],
  [2,5,'Yamin'],[2,5,'Asher'],
  [3,5,'Annesha'],[3,6,'Ornob'],[3,14,'Eesa'],[3,18,'Kishore'],[3,21,'Putushi'],[3,23,'Isabella'],[3,30,'Shantu'],
  [4,14,'Adam'],[4,16,'Hashem Khalu'],[4,20,'Jui'],[4,20,'Kinnory'],[4,27,'Papu'],[4,27,'Mojel Mami'],[4,29,'Zayeem'],
  [5,29,'Pinu Khali','2nd birthday (Punorjonmo dibosh)'],
  [6,13,'Rahmah'],[6,28,'Shomla'],[6,28,'Tanisha'],
  [7,20,'Shomla'],[7,24,'Eram'],[7,27,'Tinni'],
  [8,2,'Jadduka'],[8,6,'Atiq Khalu'],[8,6,'Kingshuk'],[8,15,'Zamini'],[8,16,'Runia'],[8,19,'Bhanu Khali'],[8,30,'Anan'],
  [9,11,'Jinu Khali'],[9,11,'Ameera'],[9,14,'Bushra'],[9,22,'Inaya'],
  [10,3,'Chumki Mami'],[10,5,'Aydin'],[10,14,'Jinjin'],[10,30,'Choni'],
  [11,5,'Kanak'],[11,13,'Kiron'],[11,28,'Shabz'],
  [12,25,'Bonna','New celebration date (old date was 12 April)'],[12,31,'Pinu Khali','As per passport and certificates']
];

let extra=[];
let currentEditId=null;
let titleClickCount=0;
try{extra=JSON.parse(localStorage.getItem('bday-extra')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('bday-extra',JSON.stringify(extra))}catch(e){}};

const now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const until=(m,d)=>{let t=new Date(t0.getFullYear(),m-1,d);if(t<t0)t=new Date(t0.getFullYear()+1,m-1,d);return Math.round((t-t0)/864e5)};
const doy=(m,d)=>Math.round((new Date(2000,m-1,d)-new Date(2000,0,0))/864e5);
const ang=v=>v/366*2*Math.PI-Math.PI/2;
const pt=(a,r)=>[200+r*Math.cos(a),200+r*Math.sin(a)];
const when=u=>u==0?'Today':u==1?'Tomorrow':u<60?`in ${u} days`:`in ${Math.round(u/30.4)} months`;
const fmtDate=(d)=>{const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}${m}${day}`;};

let people=[];
const S={kind:'all',sort:'month',m:null,q:'',page:1};

function build(){
  people=BASE.map(([m,d,n,note])=>({m,d,n,note,k:KIDS.includes(n)})).concat(extra.map((p,i)=>({...p,x:i})));
  people.forEach((p,i)=>{p.id=i;p.u=until(p.m,p.d)});
}
const nextGroup=()=>{const mn=Math.min(...people.map(p=>p.u));return people.filter(p=>p.u===mn)};
const ok=p=>(S.kind=='all'||(S.kind=='kid')==p.k)&&(S.m==null||p.m-1==S.m)&&p.n.toLowerCase().includes(S.q);

function renderPills(){
  const counts=FULL_MONTHS.map((_,i)=>people.filter(p=>p.m===i+1 && ok(p)).length);
  $('pills').innerHTML='<button data-m="">All year</button>'+FULL_MONTHS.map((m,i)=>`<button data-m="${i}">${m} <span class="count">(${counts[i]})</span></button>`).join('');
}

function renderPager(filtered){
  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  if(S.page>totalPages)S.page=totalPages;
  const pageText = filtered.length ? `Page ${S.page} of ${totalPages}` : 'No results';
  const prevDisabled = S.page===1 || filtered.length===0;
  const nextDisabled = S.page>=totalPages || filtered.length===0;
  $('pager').innerHTML=`
    <button type="button" data-action="prev" ${prevDisabled?'disabled':''}>Prev</button>
    <span class="page-indicator">${pageText}</span>
    <button type="button" data-action="next" ${nextDisabled?'disabled':''}>Next</button>
  `;
}

function drawRing(){
  let s='<circle class="core" cx="200" cy="200" r="100"/><circle class="rim" cx="200" cy="200" r="150"/>';
  SHORT_MONTHS.forEach((n,i)=>{
    const a=ang(doy(i+1,1)),[x1,y1]=pt(a,146),[x2,y2]=pt(a,158),[lx,ly]=pt(ang(doy(i+1,15)),176);
    s+=`<line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><g class="mo" data-m="${i}" tabindex="0" role="button" aria-label="Show ${FULL_MONTHS[i]}"><circle class="hit" cx="${lx}" cy="${ly}" r="16"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central">${n}</text></g>`;
  });
  const ta=ang(doy(now.getMonth()+1,now.getDate())),[a1,b1]=pt(ta,100),[a2,b2]=pt(ta,150);
  s+=`<line class="today" x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}"/><circle class="tdot" cx="${a2}" cy="${b2}" r="6"/>`;
  const nx=new Set(nextGroup().map(p=>p.id)),seen={};
  people.forEach(p=>{
    const v=doy(p.m,p.d),key=(p.k?'k':'a')+v,j=seen[key]=(seen[key]??-1)+1,[x,y]=pt(ang(v),(p.k?118:138)-j*10);
    s+=`<circle class="dot ${p.k?'k':'a'}${nx.has(p.id)?' next':''}" data-id="${p.id}" cx="${x}" cy="${y}" r="5" style="--i:${p.id}" tabindex="0" role="button" aria-label="${esc(p.n)}, ${p.d} ${FULL_MONTHS[p.m-1]}"/>`;
  });
  $('ring').innerHTML=s;
}

function center(ps,label){
  const p=ps[0],names=ps.length>2?`${p.n} and ${ps.length-1} more`:ps.map(x=>x.n).join(' & ');
  $('center').innerHTML=`<small>${label||(p.u?'Next birthday':'Happy birthday')}</small><strong>${esc(names)}</strong><span>${p.d} ${FULL_MONTHS[p.m-1]}</span><b>${when(p.u)}</b>`;
}

function openGoogleCalendar(person){
  const eventDate=new Date(t0.getFullYear(), person.m-1, person.d);
  if(eventDate < t0){eventDate.setFullYear(eventDate.getFullYear()+1);}
  const endDate=new Date(eventDate);
  endDate.setDate(endDate.getDate()+1);
  const title=encodeURIComponent(`Birthday reminder: ${person.n}`);
  const details=encodeURIComponent(`Birthday reminder for ${person.n}.`);
  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${fmtDate(eventDate)}/${fmtDate(endDate)}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function openEditDialog(id){
  const person=people[id];
  if(!person) return;
  currentEditId=id;
  $('dlgTitle').textContent='Update birthday';
  $('saveBirthday').textContent='Update birthday';
  $('fn').value=person.n;
  $('fm').value=String(person.m);
  $('fd').value=person.d;
  $('fd').max=DIM[person.m-1];
  $('fk').checked=Boolean(person.k);
  $('dlg').showModal();
}

function openAddDialog(){
  currentEditId=null;
  $('dlgTitle').textContent='Add a birthday';
  $('saveBirthday').textContent='Save birthday';
  $('f').reset();
  $('fm').value='1';
  $('fd').value='1';
  $('fd').max=DIM[0];
  $('dlg').showModal();
}

console.log('ready');
const row=p=>`<article class="row${p.k?' k':''}" id="r${p.id}">
  <div class="d">${p.d}<small>${SHORT_MONTHS[p.m-1]}</small></div>
  <div class="meta">
    <div class="n">${esc(p.n)}${p.x!=null?`<button class="x" data-x="${p.x}">Remove</button>`:''}</div>
    <div class="s">${p.k?KID_LABEL:FAMILY_LABEL}${p.note?', '+esc(p.note):''}</div>
    <div class="row-actions">
      <button type="button" class="edit" data-id="${p.id}">Correct name</button>
      <button type="button" class="gcal" data-id="${p.id}">Google Calendar</button>
    </div>
  </div>
  <div class="badge${p.u<=7?' soon':''}">${when(p.u)}</div>
</article>`;

function render(){
  const filtered=people.filter(ok);
  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  if(S.page>totalPages)S.page=totalPages;
  const start=(S.page-1)*PAGE_SIZE;
  const paged=filtered.slice(start,start+PAGE_SIZE);
  renderPills();
  renderPager(filtered);

  document.querySelectorAll('.dot').forEach(e=>e.classList.toggle('dim',!ok(people[e.dataset.id])));
  document.querySelectorAll('.mo').forEach(e=>e.classList.toggle('on',S.m==+e.dataset.m));
  document.querySelectorAll('#pills button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===''?S.m==null:+b.dataset.m==S.m));
  document.querySelectorAll('#kind button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==S.kind));
  document.querySelectorAll('#sort button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==S.sort));

  let h='';
  if(!filtered.length){
    h='<p class="empty">No one matches. Clear the search or add a birthday.</p>';
  } else if(S.sort=='next') {
    h=paged.slice().sort((a,b)=>a.u-b.u||a.n.localeCompare(b.n)).map(row).join('');
  } else {
    for(let m=0;m<12;m++){
      const g=paged.filter(p=>p.m==m+1).sort((a,b)=>a.d-b.d||a.n.localeCompare(b.n));
      if(g.length){
        h+=`<div class="mh"><h2>${SHORT_MONTHS[m]}</h2><span>${g.length} ${g.length==1?'birthday':'birthdays'}${m==now.getMonth()?', this month':''}</span></div>`+g.map(row).join('');
      }
    }
  }
  $('list').innerHTML=h;
}

function refresh(){
  build();
  drawRing();
  render();
  center(nextGroup());
}

function go(id){
  if(!ok(people[id])){S.kind='all';S.q='';S.m=null;$('q').value=''}
  render();
  const el=$('r'+id);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1700)}
}
const setMonth=i=>{S.m=S.m===i?null:i;S.page=1;render()};

const ring=$('ring');
ring.addEventListener('click',e=>{
  const m=e.target.closest('.mo'),d=e.target.closest('.dot');
  if(m)setMonth(+m.dataset.m);else if(d)go(+d.dataset.id);
});
ring.addEventListener('keydown',e=>{
  if(e.key=='Enter'||e.key==' '){const t=e.target.closest('.mo,.dot');if(t){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}
});
const peek=e=>{const d=e.target.closest&&e.target.closest('.dot');if(d)center([people[d.dataset.id]],'Birthday')};
const rest=()=>center(nextGroup());
ring.addEventListener('pointerover',peek);ring.addEventListener('focusin',peek);
ring.addEventListener('pointerout',rest);ring.addEventListener('focusout',rest);

$('pills').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.m=b.dataset.m===''?null:+b.dataset.m;S.page=1;render()}});
$('kind').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.kind=b.dataset.v;S.page=1;render()}});
$('sort').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.sort=b.dataset.v;S.page=1;render()}});
$('q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();S.page=1;render()});

$('list').addEventListener('click',e=>{
  const x=e.target.closest('.x');
  if(x){extra.splice(+x.dataset.x,1);save();refresh();return;}

  const edit=e.target.closest('.edit');
  if(edit){openEditDialog(+edit.dataset.id);return;}

  const gcal=e.target.closest('.gcal');
  if(gcal){openGoogleCalendar(people[+gcal.dataset.id]);}
});

$('pager').addEventListener('click',e=>{
  const btn=e.target.closest('button');
  if(!btn)return;
  const action=btn.dataset.action;
  if(action==='prev') S.page=Math.max(1,S.page-1);
  if(action==='next') S.page=Math.min(Math.max(1,Math.ceil(people.filter(ok).length/PAGE_SIZE)),S.page+1);
  render();
});

$('fm').innerHTML=FULL_MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
$('fm').addEventListener('change',()=>{$('fd').max=DIM[$('fm').value-1]});
$('add').addEventListener('click',()=>openAddDialog());
$('cx').addEventListener('click',()=>$('dlg').close());
$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('fn').value.trim();
  const month=+$('fm').value;
  const day=+$('fd').value;
  const isKid=$('fk').checked;

  if(!name){return;}

  if(currentEditId!=null){
    const current=people[currentEditId];
    if(current.x!=null){
      extra[current.x]={n:name,m:month,d:day,k:isKid};
    } else {
      const existingIndex=extra.findIndex(item=>item.m===current.m && item.d===current.d && item.n===current.n);
      if(existingIndex>=0){
        extra[existingIndex]={n:name,m:month,d:day,k:isKid};
      } else {
        extra.push({n:name,m:month,d:day,k:isKid});
      }
    }
  } else {
    extra.push({n:name,m:month,d:day,k:isKid});
  }

  save();
  $('f').reset();
  $('dlg').close();
  currentEditId=null;
  S.page=1;
  refresh();
});

$('resetCancel').addEventListener('click',()=>{$('resetDlg').close();});
$('resetForm').addEventListener('submit',e=>{
  e.preventDefault();
  extra=[];
  save();
  $('resetDlg').close();
  S.page=1;
  refresh();
});

$('pageTitle').addEventListener('click',()=>{
  titleClickCount += 1;
  if(titleClickCount >= RESET_THRESHOLD){
    titleClickCount = 0;
    $('resetDlg').showModal();
  }
});

$('fd').max=DIM[0];
refresh();
</script>
</body>
</html>
